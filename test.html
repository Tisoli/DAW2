<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CPU & RAM 双重极限压力测试</title>
    <style>
        body { font-family: sans-serif; padding: 30px; background: #f5f5f5; color: #333; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 500px; margin: 0 auto; }
        h2 { margin-top: 0; color: #d9534f; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px; transition: background 0.2s; }
        .btn-start { background: #d9534f; color: white; }
        .btn-start:hover { background: #c9302c; }
        .btn-stop { background: #5bc0de; color: white; }
        .btn-stop:hover { background: #31b0d5; }
        .status { margin-top: 20px; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="card">
    <h2>🔥 硬件双重压力测试</h2>
    <p>该测试通过 Web Workers 绕过单线程限制，同时轰炸所有 CPU 核心并大量吞噬内存。</p>
    
    <div class="status">
        检测到系统逻辑核心数: <strong id="core-count">检测中...</strong><br>
        当前测试状态: <strong id="test-status" style="color: #5cb85c;">未启动</strong>
    </div>
    
    <div style="margin-top: 25px;">
        <button class="btn-start" onclick="startDualTest()">🚀 开启全负载轰炸</button>
        <button class="btn-stop" onclick="stopDualTest()">🛑 停止测试</button>
    </div>
</div>

<script>
    const cores = navigator.hardwareConcurrency || 4;
    document.getElementById('core-count').innerText = cores;
    let activeWorkers = [];

    function startDualTest() {
        if (activeWorkers.length > 0) return;

        document.getElementById('test-status').innerText = "🔥 正在全力轰炸中...";
        document.getElementById('test-status').style.color = "#d9534f";

        // 多线程内部运行的代码：同时锁死 CPU 并动态吃满 RAM
        const workerCode = `
            const memoryHog = [];
            
            // 1. RAM 轰炸：定时高频塞入高密度二进制数组，同时做好防闪退处理
            setInterval(() => {
                try {
                    // 每次塞入约 24MB 的物理内存空间
                    const chunk = new Float64Array(3000000);
                    chunk.fill(Math.random()); // 强制操作系统分配真实物理内存页
                    memoryHog.push(chunk);
                } catch(e) {
                    // 如果达到浏览器单个标签页的垃圾回收/内存上限，抛出异常
                    // 此时释放一半内存，防止 Worker 直接闪退，保证测试持续进行
                    memoryHog.length = Math.floor(memoryHog.length / 2);
                }
            }, 10); // 10毫秒高频吞噬

            // 2. CPU 轰炸：纯同步死循环，死锁当前核心
            while (true) {
                Math.sqrt(Math.random() * Math.random());
            }
        `;

        // 转换代码为可执行的对象 URL
        const blob = new Blob([workerCode], { type: 'application/javascript' });
        const workerUrl = URL.createObjectURL(blob);

        // 为每一个 CPU 核心分配一个独立的轰炸线程
        for (let i = 0; i < cores; i++) {
            const worker = new Worker(workerUrl);
            activeWorkers.push(worker);
        }
    }

    function stopDualTest() {
        if (activeWorkers.length === 0) return;
        
        // 强制终止所有线程
        activeWorkers.forEach(w => w.terminate());
        activeWorkers = [];
        
        document.getElementById('test-status').innerText = "未启动";
        document.getElementById('test-status').style.color = "#5cb85c";
        
        // 提示：由于内存释放需要浏览器垃圾回收机制（GC）响应，停止后可能需要几秒钟内存才会完全掉下去
        alert("测试线程已强行终止，系统正在回收内存...");
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica 7</title>
    <style>
        * {
            box-sizing: border-box;
            background-image: url(icon.png),url(../Proyecto/Logo2.jpg),url(../Proyecto/Big-fat-fish.png);
            background-repeat: no-repeat;
            background-attachment: fixed;

        }

        body {
            margin: 0;
            font-family: sans-serif;
        }


        .menu {
            background-color: #2c3e50;
            padding: 0 20px;
        }

        .menu ul {
            list-style: none;
            margin: 0;
            padding: 0;

            display: flex;
            gap: 15px;
        }

        .menu a {
            display: block;
            padding: 20px 15px;

            color: #ffffff;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            border: 2px solid orange;
            border-radius: 60px;
        }

        .menu a:hover {
            background-color: #1abc9c;
            color: #08222e;
            border-color: #fff; 
            outline: 11px solid cadetblue;
        }

        .menu a.active {
            background-color: #16a085;
        }

        main {
            padding: 30px;

            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }

        .caja {
            position: relative;
            width: 180px;
            height: 180px;
            background-color: #ecf0f1;
            border: 3px solid #2c3e50;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: width 0.4s ease, height 0.4s ease, border-radius 0.4s ease;
        }

        .caja::after {
            content: "";
            position: absolute;
            bottom: 0;
            right: 0;
            width: 50%;
            height: 50%;
            background-image: url("image.png");
            background-size: 200% 200%;
            background-position: bottom right;
            background-repeat: no-repeat;
            transition: width 0.4s ease, height 0.4s ease, background-size 0.4s ease;
        }

        .caja:hover {
            width: 360px;
            height: 180px;
            border-radius: 12px;
        }


        .caja.activa {
            width: 360px;
            height: 180px;
            border-radius: 12px;
            
        }

        .caja.activa::after {
            width: 100%;
            height: 100%;
            background-size: 100% 100%;
        }
          

    </style>
</head>
<body>
    
    <nav class="menu">
        <ul>
            <li><a href="#" class="active">Inicio</a></li>
            <li><a href="#">Servicios</a></li>
            <li><a href="#">Proyectos</a></li>
            <li><a href="#">Sobre nosotros</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <div class="caja" onclick="this.classList.toggle('activa')"></div>
        
    </main>

</body>
</html>

<title>Gradientes</title>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/697908d42a.js" crossorigin="anonymous"></script>

</head>
<style>
*{
    font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
    font-weight: 100;
    color: white;
    border: 0;
}


.nav__responsive-ul{
    display: none;
    padding: 0;
    margin: 0;
}

.nav{
    background: rgb(10, 10, 160);
}

.nav__li{
    display: inline-block;
    padding: 15px;
    color: #fff;
}
.nav__li:hover > a{
    color: #bbb;
}
.nav__li:hover{
    color: #bbb;
}
.nav__li a{
    color: #fff;
    text-decoration: none;
}

.nav__li i {
    box-sizing: border-box;
    text-align: right;
    margin-right: 7px;
}

.nav__responsive-button-continer{
    position: absolute;
    width: 100%;
    height: 70px;
    font-size: 25px;
    background-color: #69c;
    margin-top: -74px;
    z-index: 100;


}
.nav__responsive-button{
    padding: 10px 25px;
    text-align: right;
    width: 88%;
    
}

@media only screen and (max-width: 550px) {
    	.nav__ul{
            display: none;
        }
        .nav{
            height: 100%;
            width: 100%;
            background-color: rgb(74, 97, 231);
        }
        .nav__responsive-ul{
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            height: 30px;
            margin-top: 30px;
            padding-top: 37px;
        }
        .nav__li-continer{
            position: relative;
            top: -1000px;
            height: 100%;
            transition: all 1s;
            z-index: 1;
            width: 55%;
            padding-top: -100px;

        }
       
        .nav__responsive-li{
            width: 100%;
            text-decoration: none;
            padding: 15px 40px;
            list-style: none;
            background-color: rgb(55, 23, 131);
            margin-top: 0%;


        }
        .nav__responsive-li i{
            box-sizing: border-box;
            text-align: center;
            margin-right: 5px;
            width: 5px 10px;

        }
        .nav__responsive-ul:hover >  .nav__li-continer{
            top: 0;

        }
}


</style>

<body>
<head>
    <nav class="nav">
        <ul class="nav__ul">
            <li class="nav__li"><i class="fas fa-house-user"></i><a href="#">Inicio</a></li>
            <li class="nav__li"><i class="fas fa-users"></i><a href="#">Nosotros</a></li>
            <li class="nav__li"><i class="fas fa-concierge-bell"></i></i><a href="#">Servicios</a></li>
            <li class="nav__li"><i class="fas fa-file-signature"></i></i><a href="#">Contacto</a></li>
        </ul>
        <ul class="nav__responsive-ul">
            <div class="nav__responsive-button-continer"><div class="nav__responsive-button fa fa-bars"></div></div>
           <div class="nav__li-continer">
            <li class="nav__responsive-li"><i class="fas fa-house-user"></i><a href="#">Inicio</a></li>
            <li class="nav__responsive-li"><i class="fas fa-users"></i><a href="#">Nosotros</a></li>
            <li class="nav__responsive-li"><i class="fas fa-concierge-bell"></i><a href="#">Servicios</a></li>
            <li class="nav__responsive-li"><i class="fas fa-file-signature"></i><a href="#">Contacto</a></li>
           </div>
        </ul>
    </nav>
</head>
    
</body>

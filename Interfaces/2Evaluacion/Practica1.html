<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            padding: 20px 5px;
            background-color: antiquewhite;
        }

        .box {

            text-align: center;
            background-color: yellowgreen;
            /* border-radius: 200px; */
            height: 150px;
            width: 150px;
            margin: 20px;
            animation-name: movimiento;
            animation-duration: 4s;
            position: relative;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            animation-fill-mode: both;
            animation-delay: 1s;
            /* animation-timing-function: cubic-bezier(0, 0, 0, 1.10); */
            transform: rotate(360deg);
        }

        .content {
            padding: 20px 5px;
            filter: drop-shadow(20px 20px 150px #000) drop-shadow(10px 10px 5px #000);
            width: 50%;
        }
        .img2{
            max-width: 25%;
        }
        @keyframes movimiento {
            0% {
                left: 0;
                background-color: green;
            }

            50% {
                background-color: aqua;
                border-radius: 50%;
                transform: scale(-0.5);
            }

            100% {
                left: 80%;
                background-color: yellow;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box">13
            <img src="../ds.png" alt="">
        </div>
        <div class="content"> <img src="../image.png" alt="" class="img2">
        </div>

    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de imágenes</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header class="cabecera">
        <h1>Galería de imágenes</h1>
        <p>Práctica de Interfaces: una galería con Flexbox y otra con CSS Grid.</p>
    </header>

    <!-- ============ GALERÍA 1: FLEXBOX ============ -->
    <section class="galeria">
        <h2>Galería Flexbox</h2>

        <div class="flex-galeria">
            <div class="flex-item flex-item--grande">
                <img src="img/imagen1.jpg" alt="Personajes de videojuego con neones">
            </div>
            <div class="flex-item">
                <img src="img/imagen2.jpg" alt="Humo de colores">
            </div>
            <div class="flex-item">
                <img src="img/imagen3.jpg" alt="Personaje trepando por una pared">
            </div>
            <div class="flex-item">
                <img src="img/imagen4.jpg" alt="Criatura oscura con un ojo iluminado">
            </div>
            <div class="flex-item">
                <img src="img/imagen5.jpg" alt="Grafitis de colores">
            </div>
            <div class="flex-item flex-item--grande">
                <img src="img/imagen6.jpg" alt="Árbol rosa en un paisaje azul">
            </div>
            <div class="flex-item flex-item--medio">
                <img src="img/imagen7.jpg" alt="Calavera con efecto glitch">
            </div>
            <div class="flex-item flex-item--medio">
                <img src="img/imagen8.jpg" alt="Rostro con planetas">
            </div>
            <div class="flex-item flex-item--medio">
                <img src="img/imagen9.jpg" alt="Personaje con chispas doradas">
            </div>
            <div class="flex-item flex-item--ancho">
                <img src="img/imagen10.jpg" alt="Explosión de plumas de colores">
            </div>
            <div class="flex-item flex-item--grande">
                <img src="img/imagen11.jpg" alt="Samurái con luces rojas">
            </div>
            <div class="flex-item flex-item--grande">
                <img src="img/imagen12.jpg" alt="Personaje con destellos azules">
            </div>
        </div>
    </section>

    <!-- ============ GALERÍA 2: CSS GRID ============ -->
    <section class="galeria">
        <h2>Galería CSS Grid</h2>

        <div class="grid-galeria">
            <div class="grid-item">
                <img src="img/imagen13.jpg" alt="Móviles con ilustraciones">
            </div>
            <div class="grid-item">
                <img src="img/imagen14.jpg" alt="Joker con luz morada">
            </div>
            <div class="grid-item">
                <img src="img/imagen15.jpg" alt="Capucha con sonrisa de neón">
            </div>
            <div class="grid-item">
                <img src="img/imagen16.jpg" alt="Personaje de anime">
            </div>
            <div class="grid-item">
                <img src="img/imagen1.jpg" alt="Personajes de videojuego con neones">
            </div>
            <div class="grid-item">
                <img src="img/imagen2.jpg" alt="Humo de colores">
            </div>
            <div class="grid-item">
                <img src="img/imagen3.jpg" alt="Personaje trepando por una pared">
            </div>
            <div class="grid-item">
                <img src="img/imagen4.jpg" alt="Criatura oscura con un ojo iluminado">
            </div>
            <div class="grid-item">
                <img src="img/imagen9.jpg" alt="Personaje con chispas doradas">
            </div>
            <div class="grid-item">
                <img src="img/imagen10.jpg" alt="Explosión de plumas de colores">
            </div>
            <div class="grid-item">
                <img src="img/imagen11.jpg" alt="Samurái con luces rojas">
            </div>
            <div class="grid-item">
                <img src="img/imagen12.jpg" alt="Personaje con destellos azules">
            </div>
        </div>
    </section>

    <footer class="pie">
        <p>Práctica de Interfaces · HTML5 y CSS3</p>
    </footer>

</body>

</html>

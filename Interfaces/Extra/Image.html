<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: sans-serif;
            display: grid;
            grid-template-areas:
            "img1 img1 img2 img2 img3"
            "img1 img1 img4 img5 img5"
            "img6 img6 img6 img7 img8"
            "img9 img10 img11 img11 img12"
            "img9 img13 img13 img14 img12"
            "img15 img16 img17 img18 img12"
            ;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(6, 1fr);
            gap: 5px;
            height: 100vh;
            border: 5px solid white;
        }

        body > div {
            overflow: hidden;
            min-height: 0;
            min-width: 0;
            background-color: #eee;
        }

        body > div img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
    </style>
    <title>Document</title>
</head>
<body>

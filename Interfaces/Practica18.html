<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practica1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: sans-serif;
            display: grid;
            grid-template-areas:
                "nav nav nav nav"
                "nav1 nav1 nav2 nav2"
                "aside-left body body aside-right"
                "aside-left body body aside-right"
                "aside-left body body aside-right"
                "aside-left body body aside-right"
                "aside-left body body aside-right"
                "aside-left body body aside-right"
                "aside-left body body aside-right"
                "aside-left body body aside-right"
                "aside-left body body aside-right"
                "footer footer footer footer";
            grid-template-rows: repeat(auto-fill);
            min-height: 100vh;
            border: 5px solid white;
        }

        .logo {
            grid-area: logo;
            background: #333;
            color: #fff;
        }

        .nav {
            grid-area: nav;
            background: #444;
            color: #fff;
        }

        .nav1 {
            grid-area: nav1;
            background: #2415c7;
            color: #fff;
        }

        .nav2 {
            grid-area: nav2;
            background: #1ea136;
            color: #fff;
        }

        .aside-left {
            grid-area: aside-left;
            background: #ddd;
        }

        .body {
            grid-area: body;
            background: #fff;
        }

        .aside-right {
            grid-area: aside-right;
            background: #ddd;
        }

        .footer {
            grid-area: footer;
            background: #333;
            color: #fff;
        }

        .logo,
        .nav,
        .aside-left,
        .body,
        .aside-right,
        .footer {
            padding: 1rem;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <!-- <div class="logo">Logo</div> -->
    <nav class="nav">Navegacion</nav>
    <nav class="nav1">iz</nav>
    <nav class="nav2">de</nav>
    <aside class="aside-left">izquierda</aside>
    <main class="body">body</main>
    <aside class="aside-right">derecha</aside>
    <footer class="footer">Pie</footer>
</body>

</html>
